name: travelinghub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelinghub
      POSTGRES_PASSWORD: travelinghub
      POSTGRES_DB: travelinghub
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelinghub -d travelinghub"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
    environment:
      TRAVELINGHUB_ENV: development
      TRAVELINGHUB_HTTP_ADDR: :8080
      TRAVELINGHUB_POSTGRES_DSN: postgres://travelinghub:travelinghub@postgres:5432/travelinghub?sslmode=disable
      TRAVELINGHUB_REDIS_ADDR: redis:6379
      TRAVELINGHUB_AUTO_MIGRATE: "true"
      TRAVELINGHUB_BUILD_VERSION: dev
      TRAVELINGHUB_SESSION_TTL: 168h
      TRAVELINGHUB_AUTO_VERIFY_EMAIL: "true"
      TRAVELINGHUB_WEB_ORIGIN: ${TRAVELINGHUB_WEB_ORIGIN:-http://127.0.0.1:5173}
      TRAVELINGHUB_JOURNEY_WORKER_INTERVAL: 1m
      TRAVELINGHUB_JOURNEY_WORKER_BATCH: "100"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
